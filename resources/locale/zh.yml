    permissions:
      seeParticipants: 查看抽奖参与者
      start: 发起抽奖
      self_edit: 编辑自己发起的抽奖（需要帖子编辑权限）
      self_post_edit: 编辑自己帖子中的所有抽奖（需要帖子编辑权限）
      enter: 允许参与抽奖
      canCancelEnter: 允许取消参与抽奖
      moderate: 编辑和删除抽奖

  forum:
    days_remaining: 抽奖将在 {time} 后结束。
    no_permission: 你没有参与此抽奖的权限。
    lottery_ended: 此抽奖已经结束。
    public_lottery: 查看参与者
    max_votes_allowed: "此抽奖最多允许选择 {max, plural, one {# 个条件} other {# 个条件}}。"
    widget-title: 抽奖即将开始
    days: 天
    hours: 小时
    minutes: 分钟
    seconds: 秒
    endDateText: 抽奖已结束！
    hurry_up: 抽奖即将开始
    had_enter: 你已经参与过此抽奖。
    too_many_participants: 参与人数已达到上限。
    participants_progress: 当前 {current} 人 / 最少 {minimum} 人

    lottery:
      cannot_cancel_lottery: 用户不能取消参与。
      submit_button: 参与抽奖

    composer_discussion:
      add_lottery: => nodeloc-lottery.forum.moderation.add
      edit_lottery: => nodeloc-lottery.forum.moderation.edit
      no_permission_alert: 你没有发起抽奖的权限。
      in_queue_alert: 你已经参与过此抽奖。
      no_post_in_discussion_alert: 请先在主题中回复后再参与抽奖。

    modal:
      add_title: 发起抽奖
      lottery_placeholder: 奖品名称
      price: 参与积分
      points: 积分
      amount: 中奖名额
      prizes_help: 展示在抽奖卡片中的奖品名称，建议填写清晰具体的内容。
      price_help: 每位参与者需要支付的积分；抽奖成功后归发起人，因人数不足取消时自动退回。
      amount_help: 抽奖结束后随机产生的中奖人数，建议不要超过预计参与人数。
      min_participants: 最少人数
      max_participants: 最多人数
      add_option_label: 添加条件
      date_placeholder: 开奖时间
      date_help: 必须设置在当前时间之后，且最晚不能超过 3 天；到时间后由系统自动开奖。
      edit_title: 编辑抽奖
      include_prizes: 请填写奖品名称。
      include_price: 请填写参与积分。
      include_amount: 请填写中奖名额。
      include_end_date: 请设置开奖时间。
      max: 最多只能添加 {max} 个条件。
      min: 至少需要添加 1 个条件。
      remove_option: 删除此条件
      end_date_too_far: 开奖时间不能超过当前时间后的 3 天。
      no_participants: 暂无参与者，或你没有查看参与者的权限。
      option_placeholder: 阈值
      image_option_placeholder: 图片地址（可选）
      options_label: 参与条件
      public_lottery_label: 允许查看参与者
      allow_multiple_votes_label: 允许用户选择多个条件
      participants_label: 参与人数
      participants_help: 可设置最少和最多参与人数。
      hide_votes_label: 抽奖结束前隐藏参与者
      allow_cancel_enter_label: 允许用户取消参与
      submit: 保存
      discussions_started: 发起主题数
      posts_made: 回复数
      likes_given: 点赞数
      likes_received: 获得点赞数
      best_answers: 最佳答案数
      moderator_strikes: 违规记录数
      money: 积分
      lotteries_made: 发起抽奖数
      not_enough: 条件不足
      read_permission: 访问权限

    moderation:
      add: 添加抽奖
      delete: 删除抽奖
      delete_confirm: 确定要删除这个抽奖吗？
      edit: 编辑抽奖

    tooltip:
      badge: 抽奖
      votes: "{count, plural, one {# 人参与} other {# 人参与}}"

    participants_modal:
      title: 参与者
      title_winners: 中奖者
      lottery_canceled: 因参与人数不足，抽奖已取消。

    notification:
      drawLottery: 恭喜你在抽奖中中奖！
      fail: 很遗憾，抽奖因参与人数不足而取消。
      finish: 抽奖已开奖，请联系中奖者发放奖品。

  email:
    subject:
      drawLottery: 抽奖结果通知：{discussion_title}
    body:
      drawLottery: |
        你好，{recipient_display_name}：

        恭喜你在「{discussion_title}」中中奖，抽奖发起人为 {actor_display_name}。

        查看主题：{discussion_url}
      fail: |
        你好，{recipient_display_name}：

        很遗憾，「{discussion_title}」因参与人数不足而取消。

        查看主题：{discussion_url}
      finish: |
        你好，{recipient_display_name}：

        「{discussion_title}」已经成功开奖。

        查看主题：{discussion_url}

        谢谢！
